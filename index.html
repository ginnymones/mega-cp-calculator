<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon GO Mega Evolution CP Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl md:text-4xl font-extrabold text-amber-400">Mega Evolution CP Calculator</h1>
      <p class="text-slate-400 text-sm md:text-base">Calculate exact CPs across all Mega Levels (1–4) for Pokémon GO</p>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Controls Panel -->
      <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
        <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-2">Inputs</h2>
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Select Pokémon</label>
          <select id="pokemonSelect" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 focus:outline-none">
            <option value="">Loading dataset...</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between text-sm font-medium text-slate-300 mb-1">
            <label>Pokémon Level</label>
            <span id="levelValue" class="text-amber-400 font-bold">40.0</span>
          </div>
          <input type="range" id="levelInput" min="1" max="50" step="0.5" value="40" class="w-full accent-amber-400 cursor-pointer">
          <div class="flex items-center mt-2">
            <input type="checkbox" id="bestBuddyInput" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">
            <label for="bestBuddyInput" class="ml-2 text-sm text-slate-300 cursor-pointer">Best Buddy (+1 Level)</label>
          </div>
        </div>

        <div class="space-y-3">
          <label class="block text-sm font-medium text-slate-300">Individual Values (IVs)</label>
          <div class="grid grid-cols-3 gap-3 text-center">
            <div>
              <span class="text-xs text-slate-400">ATK</span>
              <input type="number" id="atkIv" min="0" max="15" value="15" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-center text-white focus:ring-2 focus:ring-amber-400 focus:outline-none">
            </div>
            <div>
              <span class="text-xs text-slate-400">DEF</span>
              <input type="number" id="defIv" min="0" max="15" value="15" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-center text-white focus:ring-2 focus:ring-amber-400 focus:outline-none">
            </div>
            <div>
              <span class="text-xs text-slate-400">STA</span>
              <input type="number" id="staIv" min="0" max="15" value="15" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-center text-white focus:ring-2 focus:ring-amber-400 focus:outline-none">
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="setIVs(15,15,15)" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded text-slate-300">100% (15/15/15)</button>
            <button onclick="setIVs(10,10,10)" class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-1 rounded text-slate-300">Raid Floor (10/10/10)</button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Mega Level</label>
          <select id="megaLevelSelect" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-amber-400 focus:outline-none">
            <option value="1">Level 1: Base Mega</option>
            <option value="2">Level 2: High Mega</option>
            <option value="3">Level 3: Max Mega</option>
            <option value="4">Level 4: Super Max (+5 Level CPM Boost)</option>
          </select>
        </div>
      </section>

      <!-- Output Panel -->
      <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-6 flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-2 mb-4">Results</h2>
          
          <div class="bg-slate-900/80 rounded-lg p-6 text-center border border-slate-700/50">
            <span class="text-xs uppercase tracking-wider text-slate-400 block mb-1">Active Mega CP</span>
            <span id="activeCp" class="text-5xl font-black text-amber-400">0</span>
          </div>

          <!-- Comparison Table -->
          <div class="mt-6">
            <h3 class="text-sm font-semibold text-slate-300 mb-2">Mega Level Breakdown</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-700/50 text-xs text-slate-400 uppercase">
                  <tr>
                    <th class="p-2">Form / Level</th>
                    <th class="p-2">Effective Lvl</th>
                    <th class="p-2 text-right">CP</th>
                  </tr>
                </thead>
                <tbody id="breakdownTable" class="divide-y divide-slate-700"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Calculated Stats -->
        <div class="bg-slate-900/40 p-4 rounded-lg border border-slate-700/40 grid grid-cols-3 text-center text-xs">
          <div>
            <div class="text-slate-400">Effective ATK</div>
            <div id="statAtk" class="text-lg font-bold text-slate-200">0</div>
          </div>
          <div>
            <div class="text-slate-400">Effective DEF</div>
            <div id="statDef" class="text-lg font-bold text-slate-200">0</div>
          </div>
          <div>
            <div class="text-slate-400">Effective HP</div>
            <div id="statSta" class="text-lg font-bold text-slate-200">0</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Standard Game Master CP Multipliers (CPM)
    const CPM = {
      1: 0.094, 2: 0.16639787, 3: 0.21573247, 4: 0.25572005, 5: 0.29024988,
      6: 0.3210877, 7: 0.34921268, 8: 0.3752355, 9: 0.39956536, 10: 0.42250001,
      11: 0.44310755, 12: 0.46241348, 13: 0.48068684, 14: 0.49808622, 15: 0.51739395,
      16: 0.5354115, 17: 0.5528091, 18: 0.56958826, 19: 0.5857643, 20: 0.61,
      21: 0.6230132, 22: 0.63558606, 23: 0.64774373, 24: 0.6595133, 25: 0.6709117,
      26: 0.6819645, 27: 0.692688, 28: 0.703084, 29: 0.7131649, 30: 0.7317,
      31: 0.7377695, 32: 0.74378943, 33: 0.74976104, 34: 0.75568551, 35: 0.76156384,
      36: 0.76739717, 37: 0.7731865, 38: 0.778933, 39: 0.78463697, 40: 0.7903001,
      41: 0.79530001, 42: 0.8003, 43: 0.8053, 44: 0.81029999, 45: 0.81529999,
      46: 0.82029999, 47: 0.82529999, 48: 0.83029999, 49: 0.83529999, 50: 0.84029999,
      51: 0.84529999, 52: 0.85029999, 53: 0.85529999, 54: 0.86029999, 55: 0.86529999, 56: 0.87029999
    };

    function getCPM(level) {
      if (Number.isInteger(level)) return CPM[level];
      const lower = Math.floor(level);
      const upper = Math.ceil(level);
      return Math.sqrt((Math.pow(CPM[lower], 2) + Math.pow(CPM[upper], 2)) / 2);
    }

    let POKEMON_DATA = [];

    // DOM Elements
    const pokemonSelect = document.getElementById('pokemonSelect');
    const levelInput = document.getElementById('levelInput');
    const levelValue = document.getElementById('levelValue');
    const bestBuddyInput = document.getElementById('bestBuddyInput');
    const atkIv = document.getElementById('atkIv');
    const defIv = document.getElementById('defIv');
    const staIv = document.getElementById('staIv');
    const megaLevelSelect = document.getElementById('megaLevelSelect');

    // Fetch live Game Master stats from PvPoke repository
    async function loadDataset() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/pvpoke/pvpoke/master/src/data/pokemon.json');
        const rawData = await response.json();
        
        // Filter and map only Mega Pokémon entries
        POKEMON_DATA = rawData
          .filter(p => p.speciesId && p.speciesId.includes('_mega'))
          .map(p => ({
            name: p.speciesName,
            baseAtk: p.baseStats.atk,
            baseDef: p.baseStats.def,
            baseSta: p.baseStats.hp
          }))
          .sort((a, b) => a.name.localeCompare(b.name));

        // Populate dropdown menu
        pokemonSelect.innerHTML = '';
        POKEMON_DATA.forEach((p, index) => {
          const option = document.createElement('option');
          option.value = index;
          option.textContent = p.name;
          pokemonSelect.appendChild(option);
        });

        calculate();
      } catch (err) {
        pokemonSelect.innerHTML = '<option value="">Error loading stats dataset</option>';
        console.error('Failed to load Pokémon dataset:', err);
      }
    }

    function setIVs(a, d, s) {
      atkIv.value = a;
      defIv.value = d;
      staIv.value = s;
      calculate();
    }

    function calculateCp(baseAtk, baseDef, baseSta, atkIv, defIv, staIv, level) {
      const cpm = getCPM(level);
      const totalAtk = baseAtk + atkIv;
      const totalDef = baseDef + defIv;
      const totalSta = baseSta + staIv;

      const cp = Math.max(10, Math.floor((totalAtk * Math.sqrt(totalDef) * Math.sqrt(totalSta) * Math.pow(cpm, 2)) / 10));
      
      return {
        cp,
        effAtk: Math.floor(totalAtk * cpm),
        effDef: Math.floor(totalDef * cpm),
        effSta: Math.floor(totalSta * cpm)
      };
    }

    function calculate() {
      if (!POKEMON_DATA.length) return;

      const p = POKEMON_DATA[pokemonSelect.value];
      let level = parseFloat(levelInput.value);
      if (bestBuddyInput.checked) level += 1;
      
      levelValue.textContent = level.toFixed(1);

      const ivA = parseInt(atkIv.value) || 0;
      const ivD = parseInt(defIv.value) || 0;
      const ivS = parseInt(staIv.value) || 0;
      const selectedMegaLevel = parseInt(megaLevelSelect.value);

      const activeBoost = selectedMegaLevel === 4 ? 5 : 0;
      const activeResult = calculateCp(p.baseAtk, p.baseDef, p.baseSta, ivA, ivD, ivS, level + activeBoost);

      document.getElementById('activeCp').textContent = activeResult.cp;
      document.getElementById('statAtk').textContent = activeResult.effAtk;
      document.getElementById('statDef').textContent = activeResult.effDef;
      document.getElementById('statSta').textContent = activeResult.effSta;

      const tbody = document.getElementById('breakdownTable');
      tbody.innerHTML = '';

      const levels = [
        { label: "Level 1 (Base)", boost: 0 },
        { label: "Level 2 (High)", boost: 0 },
        { label: "Level 3 (Max)", boost: 0 },
        { label: "Level 4 (Super Max)", boost: 5 }
      ];

      levels.forEach((lvl, idx) => {
        const effLvl = level + lvl.boost;
        const res = calculateCp(p.baseAtk, p.baseDef, p.baseSta, ivA, ivD, ivS, effLvl);
        const isCurrent = (idx + 1) === selectedMegaLevel;

        const row = document.createElement('tr');
        row.className = isCurrent ? "bg-amber-400/10 font-bold text-amber-300" : "hover:bg-slate-700/30";
        row.innerHTML = `
          <td class="p-2">${lvl.label}</td>
          <td class="p-2">${effLvl.toFixed(1)}</td>
          <td class="p-2 text-right">${res.cp}</td>
        `;
        tbody.appendChild(row);
      });
    }

    [pokemonSelect, levelInput, bestBuddyInput, atkIv, defIv, staIv, megaLevelSelect].forEach(el => {
      el.addEventListener('input', calculate);
    });

    loadDataset();
  </script>
</body>
</html>
